# Manual, no paid inference. Source commits are fixed inside workflow, not user inputs.
name: "Protocol exact-head acceptance and telemetry"
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Qualify one fixed upstream PR head"
        required: true
        type: choice
        options: ['2508', '2514']

permissions:
  contents: read
concurrency:
  group: protocol-exact-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  cpu-oracles:
    name: "PR${{ inputs.pr }} native / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out the exact published upstream PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr == '2508' && 'ef7a58fe796b4d5603ede23994312ab0454c6875' || 'aa4ab4f28516169a87b278e86b7e686c1f5f5004' }}
          persist-credentials: false
      - name: Assert source SHA, not fork main or merge commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.pr == '2508' && 'ef7a58fe796b4d5603ede23994312ab0454c6875' || 'aa4ab4f28516169a87b278e86b7e686c1f5f5004' }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned generated-GLM oracle dependencies (public standard runner)
        run: python -m pip install --disable-pip-version-check -r c/tools/requirements-glm53-tiny.txt
      - name: Install MSYS2 UCRT64 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Native CPU GLM build (Linux/macOS)
        if: runner.os != 'Windows'
        run: make -C c -j2 glm53
      - name: Native CPU GLM build (Windows UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -C c -j2 glm53
      - name: Generate pinned upstream text and multimodal tiny model fixtures
        shell: bash
        run: |
          python c/tools/make_glm53_tiny.py --output c/_qa_text
          python c/tools/make_glm53_multimodal_tiny.py --output c/_qa_mm
      - name: Original-head early ACCEPT native protocol tests (Linux/macOS)
        if: inputs.pr == '2508' && runner.os != 'Windows'
        shell: bash
        env:
          COLI_GLM53_FIXTURE: ${{ github.workspace }}/c/_qa_mm
        run: |
          cd c
          python -m unittest -v tests.test_glm53_accept
      - name: Original-head early ACCEPT native protocol tests (Windows)
        if: inputs.pr == '2508' && runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export COLI_GLM53_FIXTURE="$(cygpath -w "$PWD/c/_qa_mm")"
          cd c
          python -m unittest -v tests.test_glm53_accept
      - name: Original-head gateway telemetry HTTP and dispatcher tests (Linux/macOS)
        if: inputs.pr == '2514' && runner.os != 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          import sys, unittest
          sys.path[:0] = ["c", "c/tests"]
          suite = unittest.defaultTestLoader.loadTestsFromNames(["test_expert_map_generation", "test_coli_gateway_stream_completion"])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun == 14 else 1)
          PY
      - name: Original-head gateway telemetry HTTP and dispatcher tests (Windows)
        if: inputs.pr == '2514' && runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          python - <<'PY'
          import sys, unittest
          sys.path[:0] = ["c", "c/tests"]
          suite = unittest.defaultTestLoader.loadTestsFromNames(["test_expert_map_generation", "test_coli_gateway_stream_completion"])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun == 14 else 1)
          PY
      - name: Overlay only #2519 corrected serve test harness (no production changes)
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.pr == '2508' && 'ef7a58fe796b4d5603ede23994312ab0454c6875' || 'aa4ab4f28516169a87b278e86b7e686c1f5f5004' }}"
          git fetch --no-tags --depth=1 https://github.com/appleguy/colibri-upstream.git 98fa85e99957858f6e3490d1ecefa469d0f80955
          test "$(git rev-parse FETCH_HEAD)" = "98fa85e99957858f6e3490d1ecefa469d0f80955"
          git show FETCH_HEAD:c/tests/glm53_serve_harness.py > c/tests/glm53_serve_harness.py
          test "$(git diff --name-only)" = "c/tests/glm53_serve_harness.py"
          git diff --check
      - name: Full generated text/multimodal/pin/serve oracle, test-only overlay (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GLM53_TINY: ${{ github.workspace }}/c/_qa_text
          GLM53_MM_TINY: ${{ github.workspace }}/c/_qa_mm
        run: |
          cd c
          python -m unittest -v tests.test_glm53_oracles
      - name: Full generated text/multimodal/pin/serve oracle, test-only overlay (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export GLM53_TINY="$(cygpath -w "$PWD/c/_qa_text")"
          export GLM53_MM_TINY="$(cygpath -w "$PWD/c/_qa_mm")"
          cd c
          python -m unittest -v tests.test_glm53_oracles
