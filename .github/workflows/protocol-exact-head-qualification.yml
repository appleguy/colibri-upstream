# Manual-only, exact-source, generated-tiny CPU qualification of retained #2519 + #2508.
# Stored only on an isolated owner-fork CI branch. Public standard hosted runners, no paid inference.
name: "Protocol exact-head acceptance and telemetry"
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Exact two retained PRs; #2514 withdrawn"
        required: true
        type: choice
        options: ['integrated']

permissions:
  contents: read
concurrency:
  group: protocol-two-pr-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  combined-native:
    if: inputs.pr == 'integrated'
    name: "Protocol review stack / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout exact original PR2519 commit (not a merge ref)
        uses: actions/checkout@v4
        with:
          ref: 98fa85e99957858f6e3490d1ecefa469d0f80955
          fetch-depth: 2
          persist-credentials: false
      - name: Compose original public PR commits without commits, merges, or rewrites
        shell: bash
        run: |
          set -euo pipefail
          base=22e844096dc2f8ad6f64e79cdfd9cd75681737f2
          b2519=98fa85e99957858f6e3490d1ecefa469d0f80955
          b2508=ef7a58fe796b4d5603ede23994312ab0454c6875
          test "$(git rev-parse HEAD)" = "$b2519"
          test "$(git rev-parse HEAD^)" = "$base"
          git fetch --no-tags --depth=2 https://github.com/appleguy/colibri-upstream.git \
            +refs/heads/pr/glm53-accept-before-prefill:refs/remotes/ci/accept
          test "$(git rev-parse refs/remotes/ci/accept)" = "$b2508"
          test "$(git rev-parse "$b2508^")" = "$base"
          git diff --binary "$base" "$b2508" > "$RUNNER_TEMP/pr2508.patch"
          git apply --check "$RUNNER_TEMP/pr2508.patch"
          git apply "$RUNNER_TEMP/pr2508.patch"
          git diff --check
          test "$(git rev-parse HEAD)" = "$b2519"
          echo "Exact retained PR sources: base=$base, #2519=$b2519, #2508=$b2508"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned free generated tiny-oracle dependencies
        run: python -m pip install --disable-pip-version-check -r c/tools/requirements-glm53-tiny.txt
      - name: Install MSYS2 UCRT64 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Build combined native CPU GLM53 (Linux/macOS)
        if: runner.os != 'Windows'
        run: make -C c -j2 glm53
      - name: Build combined native CPU GLM53 (Windows UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -C c -j2 glm53
      - name: Generate pinned text and multimodal GLM53 fixtures
        shell: bash
        run: |
          python c/tools/make_glm53_tiny.py --output c/_qa_text
          python c/tools/make_glm53_multimodal_tiny.py --output c/_qa_mm
      - name: Run 36 retained protocol and gateway tests (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GLM53_TINY: ${{ github.workspace }}/c/_qa_text
          GLM53_MM_TINY: ${{ github.workspace }}/c/_qa_mm
          COLI_GLM53_FIXTURE: ${{ github.workspace }}/c/_qa_mm
          PYTHONPATH: ${{ github.workspace }}/c:${{ github.workspace }}/c/tests
        run: |
          set -e
          cd c
          python -m unittest discover -s tests -p test_glm53_busy_harness.py -v
          python -m unittest -v tests.test_glm53_accept
          python -m unittest -v tests.test_openai_server.AcceptFrameTest tests.test_openai_server.StreamingContextRejectTest tests.test_openai_server.KeepAliveFramingTest
          python -m unittest -v tests.test_glm53_oracles
      - name: Run 36 retained protocol and gateway tests (Windows UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -e
          export GLM53_TINY="$(cygpath -w "$PWD/c/_qa_text")"
          export GLM53_MM_TINY="$(cygpath -w "$PWD/c/_qa_mm")"
          export COLI_GLM53_FIXTURE="$GLM53_MM_TINY"
          export PYTHONPATH="$(cygpath -w "$PWD/c");$(cygpath -w "$PWD/c/tests")"
          cd c
          python -m unittest discover -s tests -p test_glm53_busy_harness.py -v
          python -m unittest -v tests.test_glm53_accept
          python -m unittest -v tests.test_openai_server.AcceptFrameTest tests.test_openai_server.StreamingContextRejectTest tests.test_openai_server.KeepAliveFramingTest
          python -m unittest -v tests.test_glm53_oracles
