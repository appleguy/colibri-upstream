# Manual-only public-fork exact-source QA, no inference, artifacts or caches.
name: "GLM exact-host PR trio: manual CPU qualification"
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Exact whitelisted PR revision to test"
        required: true
        type: choice
        options:
          - "2507"
          - "2509"
          - "2506"

permissions:
  contents: read

concurrency:
  group: glm-trio-20261030-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  native:
    name: "Exact PR #${{ inputs.pr }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Resolve strictly whitelisted exact source SHA
        id: source
        shell: bash
        env:
          SELECTED_PR: ${{ inputs.pr }}
        run: |
          case "$SELECTED_PR" in
            2507) sha=3222839f5a7a5c305c85e1b81a595a075c626114 ;;
            2509) sha=81eaf8073cb2970e4760a9caa534a4b13118261d ;;
            2506) sha=17ad27e5b35fba317bd71539a676a34f606b14ae ;;
            *) echo "Unrecognized exact PR input"; exit 2 ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Testing #$SELECTED_PR at $sha"

      - name: Checkout public fork at exact PR SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Assert the exact source, no merge ref or drift
        shell: bash
        env:
          EXPECT: ${{ steps.source.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECT"
          git diff --check
          git status --porcelain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned CPU-only Transformers reference dependencies
        if: inputs.pr != '2509'
        run: python -m pip install --disable-pip-version-check -r c/tools/requirements-glm53-tiny.txt

      - name: Set up native Windows UCRT64 compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python

      - name: Install native OpenMP runtime on macOS
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Build exact CPU source and targeted checks on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        env:
          SELECTED_PR: ${{ inputs.pr }}
        run: |
          case "$SELECTED_PR" in
            2507) make -C c -j2 glm53 tests/test_glm53_live_prefix ;;
            2509) make -C c -j2 glm53 tests/test_compat_direct ;;
            2506) make -C c -j2 glm53 tests/test_glm53_host ;;
          esac

      - name: Run C correctness checks on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        env:
          SELECTED_PR: ${{ inputs.pr }}
        run: |
          case "$SELECTED_PR" in
            2507) c/tests/test_glm53_live_prefix ;;
            2509)
              # The Windows-only check emits an explicit POSIX skip.
              output="$(c/tests/test_compat_direct)"
              echo "$output"
              [[ "$output" == *"skipped (POSIX"* ]]
              ;;
            2506) c/tests/test_glm53_host ;;
          esac

      - name: Build exact CPU source and targeted checks on Windows UCRT64
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          SELECTED_PR: ${{ inputs.pr }}
        run: |
          case "$SELECTED_PR" in
            2507) make -C c -j2 glm53 tests/test_glm53_live_prefix.exe ;;
            2509) make -C c -j2 glm53 tests/test_compat_direct.exe ;;
            2506) make -C c -j2 glm53 tests/test_glm53_host.exe ;;
          esac

      - name: Run C checks and negative control on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          SELECTED_PR: ${{ inputs.pr }}
        run: |
          cd c
          case "$SELECTED_PR" in
            2507)
              ./tests/test_glm53_live_prefix.exe
              ;;
            2509)
              ./tests/test_compat_direct.exe
              cp compat.h compat.h.selected
              trap 'mv compat.h.selected compat.h' EXIT
              # Reverse exactly the one added flag, without relying on git
              # inside MSYS2 or shallow-history availability.
              test "$(grep -c 'FILE_FLAG_NO_BUFFERING | FILE_FLAG_OVERLAPPED' compat.h)" = 1
              sed -i 's/FILE_FLAG_NO_BUFFERING | FILE_FLAG_OVERLAPPED/FILE_FLAG_NO_BUFFERING/' compat.h
              gcc -O2 -D_FILE_OFFSET_BITS=64 -fopenmp -o tests/test_compat_direct_baseline.exe tests/test_compat_direct.c -lpsapi
              if ./tests/test_compat_direct_baseline.exe > baseline-error.log 2>&1; then
                echo "FAIL: unmodified sync-handle baseline unexpectedly passed"
                exit 4
              fi
              grep -q "direct handle is synchronous" baseline-error.log
              echo "PASS: unmodified baseline failed the intended handle-mode negative control"
              mv compat.h.selected compat.h
              trap - EXIT
              grep -q 'FILE_FLAG_NO_BUFFERING | FILE_FLAG_OVERLAPPED' compat.h
              ;;
            2506)
              ./tests/test_glm53_host.exe
              gcc -O2 -D_FILE_OFFSET_BITS=64 -fopenmp -msse4.1 -mno-avx2 -mno-fma \
                tests/test_glm53_host.c -o tests/test_glm53_host_sse.exe -lm
              ./tests/test_glm53_host_sse.exe
              ;;
          esac

      - name: Generate official CPU Transformers tiny text and multimodal references
        if: inputs.pr != '2509'
        shell: bash
        run: |
          python c/tools/make_glm53_tiny.py --output c/_qa_text
          python c/tools/make_glm53_multimodal_tiny.py --output c/_qa_mm

      - name: Generated vendor text, vision, serve, pin oracles on Linux and macOS
        if: runner.os != 'Windows' && inputs.pr != '2509'
        shell: bash
        env:
          GLM53_TINY: ${{ github.workspace }}/c/_qa_text
          GLM53_MM_TINY: ${{ github.workspace }}/c/_qa_mm
        run: |
          cd c
          python -m unittest -v tests.test_glm53_oracles

      - name: Generated vendor text, vision, serve, pin oracles on Windows
        if: runner.os == 'Windows' && inputs.pr != '2509'
        shell: msys2 {0}
        run: |
          export GLM53_TINY="$(cygpath -w "$PWD/c/_qa_text")"
          export GLM53_MM_TINY="$(cygpath -w "$PWD/c/_qa_mm")"
          cd c
          python -m unittest -v tests.test_glm53_oracles
