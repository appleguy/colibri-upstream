# Manual, read-only, no paid inference. Standard runners on public fork.
# Deliberately lives on fork main. Checkout tests exact upstream PR SHA, never merge ref.
name: "PR2519 exact-head portable qualification"
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr2519-exact-head-20261030
  cancel-in-progress: false

jobs:
  native-oracles:
    name: "PR2519 native / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout source at exact published PR head
        uses: actions/checkout@v4
        with:
          ref: 98fa85e99957858f6e3490d1ecefa469d0f80955
          persist-credentials: false
      - name: Refuse checkout drift
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "98fa85e99957858f6e3490d1ecefa469d0f80955"
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned free CPU-only generated-oracle requirements
        run: python -m pip install --disable-pip-version-check -r c/tools/requirements-glm53-tiny.txt
      - name: Set up MSYS2 UCRT64 (Windows only)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: Install libomp (macOS only)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Build native CPU GLM engine (Linux and macOS)
        if: runner.os != 'Windows'
        run: make -C c -j2 glm53
      - name: Build native CPU GLM engine (Windows UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -C c -j2 glm53
      - name: Generate pinned tiny text and multimodal reference fixtures
        shell: bash
        run: |
          python c/tools/make_glm53_tiny.py --output c/_qa_text
          python c/tools/make_glm53_multimodal_tiny.py --output c/_qa_mm
      - name: Native counted-frame, busy-slot and full generated oracles (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GLM53_TINY: ${{ github.workspace }}/c/_qa_text
          GLM53_MM_TINY: ${{ github.workspace }}/c/_qa_mm
        run: |
          cd c
          python -m unittest discover -s tests -p test_glm53_busy_harness.py -v
          python -m unittest -v tests.test_glm53_oracles
      - name: Native counted-frame, busy-slot and full generated oracles (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export GLM53_TINY="$(cygpath -w "$PWD/c/_qa_text")"
          export GLM53_MM_TINY="$(cygpath -w "$PWD/c/_qa_mm")"
          cd c
          python -m unittest discover -s tests -p test_glm53_busy_harness.py -v
          python -m unittest -v tests.test_glm53_oracles
